      - asyncify: './libs/asyncify/README.ipynb'
      - funkify: './libs/funkify/README.ipynb'
      - h5: './libs/h5/README.ipynb'
      - jsonbourne: './libs/jsonbourne/README.ipynb'
      - lager: './libs/lager/README.ipynb'
      - requires: './libs/requires/README.ipynb'
      - xtyping: './libs/xtyping/README.ipynb'
  - API:
      - aiopen: './libs/aiopen/aiopen.api.md'
      - asyncify: './libs/asyncify/asyncify.api.md'
      - fmts: './libs/fmts/fmts.api.md'
      - funkify: './libs/funkify/funkify.api.md'
      - h5: './libs/h5/h5.api.md'
      - requires: './libs/requires/requires.api.md'
      - listless: './libs/listless/listless.api.md'
      - jsonbourne: './libs/jsonbourne/jsonbourne.api.md'
      - shellfish:
          - shellfish: './libs/shellfish/shellfish.api.md'
          - shellfish.sh: './libs/shellfish/sh.md'
          - shellfish.fs: './libs/shellfish/fs.md'
          - shellfish.fs.promises: './libs/shellfish/fs.promises.md'
          - shellfish.done: './libs/shellfish/done.md'
          - shellfish.exe: './libs/shellfish/exe.md'
          - shellfish.process: './libs/shellfish/process.md'
          - shellfish.sp: './libs/shellfish/sp.md'
          - shellfish.osfs: './libs/shellfish/osfs.md'
          - shellfish.aios: './libs/shellfish/aios.md'
          - shellfish.dotenv: './libs/shellfish/dotenv.md'
          - shellfish.echo: './libs/shellfish/echo.md'
          - shellfish.stdio: './libs/shellfish/stdio.md'
      - xtyping: './libs/xtyping/xtyping.api.md'
  # - Notebooks:
  #     - Cache Money: './notebooks/cache_money.ipynb'
  #     - Filter None: './notebooks/filter_none.ipynb'
  #     - JSON "parsing": './notebooks/json_parsing.ipynb'
  #     - String Formatting: './notebooks/string_fmt.ipynb'

theme:
  name: 'material'
  logo: 'images/dgpy_white_edge_small.png'
  favicon: images/favicon.png

  icon:
    repo: fontawesome/brands/github-alt
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate

markdown_extensions:
  - attr_list
  - admonition
  - callouts
  - footnotes
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tilde
  - pymdownx.magiclink
  - pymdownx.escapeall
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.betterem:
      smart_enable: all
  - toc:
      permalink: ⚓︎

plugins:
  - search:
      lang: en
  - mkdocs-jupyter:
      execute: false
  ### MKDOCSTRINGS ###
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          # NOTE: these must point at the `src` dirs -- pointing at `libs/<lib>`
          # picks up the stale pre-src-layout `libs/<lib>/<lib>` husks (which
          # hold only __pycache__), so griffe collects empty packages. That is
          # invisible when the libs happen to be installed in the venv, but
          # breaks `nox -s mkdocs_serve`, which installs only the mkdocs deps.
          paths:
            - libs/aiopen/src
            - libs/asyncify/src
            - libs/fmts/src
            - libs/funkify/src
            - libs/h5/src
            - libs/jsonbourne/src
            - libs/requires/src
            - libs/listless/src
            - libs/shellfish/src
            - libs/xtyping/src
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: ["!^_"]
            heading_level: 1
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            show_docstring_attributes: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
