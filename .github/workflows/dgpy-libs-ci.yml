name: dgpy-libs-ci

on: [push, pull_request]

jobs:
  fmtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: ruff-check
        run: |
          python -m pip install --upgrade pip
          pip install -U ruff
          ruff format --check .
          ruff check --select "I" .
  ruff: # TODO: rename this job to be not just "ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: ruff-check
        run: |
          uv run ruff --version
          uv run ruff check .
      - name: ty
        run: |
          uv run ty --version
          uv run ty check
      - name: pyrefly
        run: |
          uv run pyrefly --version
          uv run pyrefly check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: mypy
        run: |
          pip install nox
          nox -s lint

  test:
    runs-on: ubuntu-latest

    # matrix of python versions to test against
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # set uv environment variables
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv-sync
        run: uv sync --all-extras --dev

      - name: test-dgpydev
        run: |
          uv run pytest --doctest-modules tests

      - name: test listless
        run: |
          cd libs/listless
          uv run pytest --doctest-modules

      - name: test fmts
        run: |
          cd libs/fmts
          uv run pytest --doctest-modules

      - name: test xtyping
        run: |
          cd libs/xtyping
          uv run pytest

      - name: test asyncify
        run: |
          cd libs/asyncify
          uv run pytest --cov=asyncify --doctest-modules

      - name: test requires
        run: |
          cd libs/requires
          uv run pytest tests

      - name: test aiopen
        run: |
          cd libs/aiopen
          uv run pytest --doctest-modules

      - name: test lager
        run: |
          cd libs/lager
          uv run pytest tests

      - name: test jsonbourne
        run: |
          cd libs/jsonbourne
          uv run pytest --doctest-modules

      - name: test shellfish
        run: |
          cd libs/shellfish
          uv run pytest --doctest-modules

      - name: test dgpylibs
        run: |
          cd libs/dgpylibs
          uv run pytest --doctest-modules

  docs:
    permissions:
      contents: write
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install-uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: uv-sync
        run: uv sync --all-extras --dev
      - name: install docs deps
        run: uv pip install '.[docs]'
      - name: check docs/notebooks markdown is up to date
        run: |
          bash scripts/mkreadnb.sh
          if ! git diff --exit-code -- docs/notebooks/; then
            echo "::error::docs/notebooks/*.md is out of date with its .ipynb -- run scripts/mkreadnb.sh and commit the result"
            exit 1
          fi
      - name: zensical build
        run: uv run zensical build --clean
      - name: deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
