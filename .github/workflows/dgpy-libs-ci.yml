name: dgpy-libs-ci

on: [push, pull_request]

# Jobs:
#   lint       prek: ruff (check, format), yaml, whitespace (the hooks that run on commit)
#   typecheck  mypy, ty, pyrefly
#   test       pytest for each lib, on each Python version
#   docs       generated notebook pages are up to date; zensical build; deploy on main
#   ci-ok      passes only when all the jobs above pass. The ONLY required check:
#              rename or add jobs freely, branch protection does not change.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: prek
        run: uv run prek run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install-just
        uses: extractions/setup-just@v4
      - name: mypy
        run: just mypy
      - name: ty
        run: |
          uv run ty --version
          uv run ty check
      - name: pyrefly
        run: |
          uv run pyrefly --version
          uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one failing Python version does not cancel the others
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: uv-sync
        run: uv sync --all-extras --dev
      - name: test-dgpydev
        run: uv run pytest --doctest-modules tests
      - name: test-listless
        working-directory: libs/listless
        run: uv run pytest --doctest-modules
      - name: test-fmts
        working-directory: libs/fmts
        run: uv run pytest --doctest-modules
      - name: test-asyncify
        working-directory: libs/asyncify
        run: uv run pytest --cov=asyncify --doctest-modules
      - name: test-requires
        working-directory: libs/requires
        run: uv run pytest tests
      - name: test-aiopen
        working-directory: libs/aiopen
        run: uv run pytest --doctest-modules
      - name: test-lager
        working-directory: libs/lager
        run: uv run pytest tests
      - name: test-jsonbourne
        working-directory: libs/jsonbourne
        run: uv run pytest --doctest-modules
      - name: test-shellfish
        working-directory: libs/shellfish
        run: uv run pytest --doctest-modules
      - name: test-dgpylibs
        working-directory: libs/dgpylibs
        run: uv run pytest --doctest-modules

  docs:
    permissions:
      contents: write
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install-uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: uv-sync
        run: uv sync --all-extras --dev
      - name: install-docs-deps
        run: uv pip install '.[docs]'
      - name: notebook-pages-up-to-date
        run: |
          bash scripts/mkreadnb.sh
          if ! git diff --exit-code -- docs/notebooks/; then
            echo "::error::docs/notebooks/*.md is out of date with its .ipynb -- run scripts/mkreadnb.sh and commit the result"
            exit 1
          fi
      - name: zensical-build
        run: uv run zensical build --clean
      - name: deploy-gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

  ci-ok:
    if: always()
    needs: [lint, typecheck, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: all-jobs-passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
