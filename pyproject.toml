[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.8,<0.14" ]

[project]
name = "dgpydev"
version = "0.1.0"
description = "dgpy-libs development"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiopen",
  "asyncify",
  "dgpylibs",
  "dgpytest",
  "fmts",
  "h5[cli]",
  "jsonbourne",
  "lager",
  "listless",
  "requires",
  "shellfish",
]

optional-dependencies.docs = [
  "markdown>=3.6",
  "markdown-callouts>=0.4",
  "mkdocs-autorefs>=1.4",
  "mkdocstrings-python>=1.10.9",
  "pymdown-extensions>=11",
  "zensical>=0.1.1",
]
scripts.dgpydev = "dgpydev.cli:main"

[dependency-groups]
dev = [
  "anyio>=4.6.2.post1",
  "ipython>=8.37.0",
  "mypy>=1.11.1",
  "orjson>=3.10.18",
  "pydantic>=2.11.5",
  "pyrefly>=1.1.1",
  "pytest-cov>=6.1.1",
  "rich>=13.9.3",
  "prek>=0.5.11",
  "ruff==0.17.5",
  "rumdl==0.3.6",
  "tomli>=2.0.1",
  "ty>=0.0.102",
]

[tool.uv.build-backend]
module-name = "dgpydev"
module-root = ""

[tool.uv.workspace]
members = [
  "libs/aiopen",
  "libs/asyncify",
  "libs/dgpylibs",
  "libs/dgpytest",
  "libs/fmts",
  "libs/h5",
  "libs/jsonbourne",
  "libs/lager",
  "libs/listless",
  "libs/requires",
  "libs/shellfish",
]

[tool.uv.sources]
aiopen = { workspace = true }
asyncify = { workspace = true }
dgpylibs = { workspace = true }
dgpytest = { workspace = true }
fmts = { workspace = true }
h5 = { workspace = true }
jsonbourne = { workspace = true }
lager = { workspace = true }
listless = { workspace = true }
requires = { workspace = true }
shellfish = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 88
preview = true

[tool.ruff.lint]
select = [
  "ANN",    # annotations
  "B",      # bugbear
  "C4",     # comprehensions
  "D",      # pydocstyle
  "E",      # pyflakes errors
  "EM102",  # f-string-in-exception
  "EM103",  # dot-format-in-exception
  "ERA001", # erradicate
  "F",      # pyflakes warnings
  "FA102",  # require `from __future__ import annotations`
  "FBT",    # flake8-boolean-trap
  "FLY",    # flynt
  "G004",   # logging-f-string
  "I",      # isort
  "ICN",
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PLE",    # pylint errors
  "PLW1514", # unspecified-encoding
  "PT",     # flake8-pytest-style
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RUF",    # ruff
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T201",   # print
  "TC",     # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # flake8-pyupgrade
  "W",      # pyflakes warnings
  "YTT",    # flake8-2020
  # -- TODO --
  # "EM101",  # raw-string-in-exception
  # "N",
  # "PLW",
  # "PLR",
]
ignore = [
  "ANN401", # use of Any
  "C417",   # super annoying
  "C901",   # too complex
  "RUF052", # used-dummy-variable
  "RUF105", # noqa-comments - FIX ONCE OUT OF PREVIEW?
  "RUF201", # rule-codes-in-selectors - FIX ONCE OUT OF PREVIEW AS WELL
  # PYDOCSTYLE
  "D100", # undocumented-public-module
  "D101", # undocumented-public-class
  "D102", # undocumented-public-method
  "D103", # undocumented-public-function
  "D104", # undocumented-public-package
  "D105", # undocumented-magic-method
  "D107", # undocumented-public-init
  "D403", # first-line-capitalized
  "D415", # first line should end with a period/exclamation point
  "E501", # line too long,
  "FA",
  # PIE
  "PIE804", # unnecessary-dict-kwargs -- TODO: revisit?
  "SIM105", # suppressible-exception
  "SIM115", # open-file-with-context-handler
  # PYUPGRADE
  "UP009", # utf-8 encoding declaration (not needed b/c I am nostalgic)
  "UP022", # must test shellfish first...
]

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["D"]
"**/tests/*.py" = [
  "ANN401", # use of Any
  "D1",
  "D100",   # missing docstring in public module
  "D102",
  "D103",   # missing docstring
  "S101",   # use of assert
]
"*.ipynb" = ["ANN", "E741", "PERF", "F401", "F811", "F821", "RUF031", "T201"]
"libs/jsonbourne/src/jsonbourne/trydantic.py" = [
  "I001", # isort something wrong with in try block import
]
"libs/requires/tests/test_requires.py" = [
  "F821", # undefined name; not valid for this test file
]
"libs/requires/tests/test_requires_w_json_libs.py" = [
  "F821", # undefined name; not valid for this test file
]
"libs/shellfish/tests/*" = [
  "D100", # missing docstring
]

[tool.ruff.lint.flake8-errmsg]
max-string-length = 20

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
  "aiopen",
  "asyncify",
  "dgpylibs",
  "dgpytest",
  "fmts",
  "h5",
  "jsonbourne",
  "lager",
  "listless",
  "requires",
  "shellfish",
]
lines-after-imports = -1
lines-between-types = 1

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["pydantic.Field"]
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pydocstyle]
convention = "google"

# REF: https://github.com/crate-ci/typos/blob/master/docs/reference.md
# install typos: cargo install typos-cli

[tool.typos.files]
extend-exclude = [
  "libs/shellfish/src/shellfish/fs/_async.py",
  "_data/pypi-classifiers.json",
]

[tool.typos.default]
extend-ignore-identifiers-re = [
  "arange", # range list fn
  "NdArray",
  "typ",
]
extend-ignore-re = [
  # disable line with `# spellchecker:disable-line` or `// spellchecker:disable-line`
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  # ignore line with `# typos:ignore` or `// typos:ignore`
  "(?Rm)^.*(#|//)\\s*typos:ignore$",
  # ignore block with `# typos:off` and `# typos:on`
  "(?s)(#|//)\\s*typos:off.*?\\n\\s*(#|//)\\s*typos:on",
  # ignore block with `# spellchecker:<on|off>` or `// spellchecker:<on|off>`
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[tool.typos.default.extend-identifiers]

[tool.typos.default.extend-words]
2nd = "2nd"
Opps = "Opps" # PyPI classifier "Framework :: Opps"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
]
# NOTE: the `libs/src/<pkg>` entries below are stale -- the real layout is
# `libs/<pkg>/src/<pkg>`, so they collect nothing. Correcting them all at once
# exposes pre-existing failures (a broken `fmts.timestamp` doctest, and
# `jsonbourne/fastapi.py` needing the optional `starlette` dep), so only
# shellfish is corrected here; the rest are left for a follow-up.
testpaths = [
  "libs/src/aiopen",
  "libs/src/asyncify",
  "libs/src/dgpylibs",
  "libs/src/dgpytest",
  "libs/src/fmts",
  "libs/src/h5",
  "libs/src/jsonbourne",
  "libs/src/lager",
  "libs/src/listless",
  "libs/src/requires",
  "libs/shellfish/src/shellfish",
  "tests",
]

xfail_strict = true
filterwarnings = [
  "error",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "timeout",
  "skip: skip test",
  "anyio: anyio tests",
  "aio: asyncio tests",
  "basic: basic tests",
  "version",
]
# =============================================================================
# /\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/
# =============================================================================
#  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\  /\
# /  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \/  \
# =============================================================================
# \/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\
# =============================================================================

[tool.mypy]
plugins = [ "pydantic.mypy" ]
python_version = "3.11"
show_error_codes = true
follow_imports = 'silent'
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
implicit_reexport = false
strict = true
strict_equality = true
show_error_context = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool", ]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_defs = true

# starlette is an optional dep (not in the dev env); `Response` resolves to Any
[[tool.mypy.overrides]]
module = "jsonbourne.fastapi"
disallow_subclassing_any = false
warn_unused_ignores = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = [
  "libs/aiopen/src",
  "libs/asyncify/src",
  "libs/dgpylibs/src",
  "libs/dgpytest/src",
  "libs/fmts/src",
  "libs/h5/src",
  "libs/jsonbourne/src",
  "libs/lager/src",
  "libs/listless/src",
  "libs/requires/src",
  "libs/shellfish/src",
]

[tool.ty.analysis]
allowed-unresolved-imports = [ "httpx", "jsonc2json", "rapidjson", "starlette.**" ]

# error on stale `# ty: ignore[...]` comments (ty is still a wip)
[tool.ty.rules]
unused-ignore-comment = "error"

# jsonlib declares orjson/rapidjson as `None` when not imporable
[[tool.ty.overrides]]
include = [ "libs/jsonbourne/src/jsonbourne/jsonlib.py" ]
rules = { missing-union-attribute = "ignore" }

[tool.pyrefly]
python-version = "3.11"
# the workspace libs are editable-installed, so their src dirs are on the
# site-package path; without this pyrefly auto-excludes them from the project
disable-project-excludes-heuristics = true
project-includes = [
  "libs/aiopen/src",
  "libs/asyncify/src",
  "libs/dgpylibs/src",
  "libs/dgpytest/src",
  "libs/fmts/src",
  "libs/h5/src",
  "libs/jsonbourne/src",
  "libs/lager/src",
  "libs/listless/src",
  "libs/requires/src",
  "libs/shellfish/src",
]
project-excludes = [
  "**/.venv",
  "**/__pycache__",
  "**/node_modules",
]
# optional extras that are not installed in the dev env
ignore-missing-imports = [
  "httpx",
  "httpx.*",
  "jsonc2json",
  "rapidjson",
  "starlette",
  "starlette.*",
]

# jsonlib binds orjson/rapidjson to None when they are not installed and only
# touches them behind availability checks
[[tool.pyrefly.sub-config]]
matches = "libs/jsonbourne/src/jsonbourne/jsonlib.py"
errors = { missing-attribute = false }

[tool.rumdl]
include = ["docs/**/*.md", "README.md", "CHANGELOG.md", "libs/*/README.md"]
exclude = ["docs/notebooks/**"]

[tool.rumdl.per-file-ignores]
"docs/libs/**/*.md" = ["MD033", "MD041"]
"docs/index.md" = ["MD041"]
"libs/*/README.md" = ["MD033", "MD041"]
"README.md" = ["MD033", "MD041", "MD057"]
"CHANGELOG.md" = ["MD024"]

[tool.rumdl.MD013]
reflow = true
reflow-mode = "sentence-per-line"
line-length = 0
tables = false
code-blocks = false

[tool.rumdl.MD007]
indent = 4
